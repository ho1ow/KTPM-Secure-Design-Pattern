worker_processes auto;
env JWT_SECRET;                     # cho phép Lua đọc os.getenv("JWT_SECRET")

events { worker_connections 1024; }

http {
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";
    default_type application/json;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream user_svc  { server user:3001;  keepalive 32; }
    upstream order_svc { server order:3002; keepalive 32; }

    # ---- Offloading: rate limit 10 request/giây theo IP ----
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # =========================================================
    # Server chính cho client (publish ra ngoài :8080)
    # =========================================================
    server {
        listen 80;

        # rate limit chạy ở pha preaccess, TRƯỚC khi verify JWT
        limit_req zone=per_ip burst=10 nodelay;

        # ---- Public: đăng nhập, chưa có token ----
        location = /users/login {
            proxy_pass http://user_svc;
        }

        # ---- Routing + Offloading (JWT -> token nội bộ có aud) ----
        location /users/ {
            access_by_lua_block { require("auth").verify("user-service") }
            proxy_pass http://user_svc;
        }

        location /orders {
            access_by_lua_block { require("auth").verify("order-service") }
            proxy_pass http://order_svc;
        }

        # ---- Aggregation ----
        location = /dashboard {
            access_by_lua_block  { require("auth").verify() }
            content_by_lua_block { require("dashboard").handle() }
        }

        # Sub-request nội bộ cho /dashboard (client không gọi được).
        # Sub-request bỏ qua access phase nên ký token ở rewrite phase.
        location /_internal/user/ {
            internal;
            rewrite_by_lua_block { require("auth").forward("user-service") }
            proxy_read_timeout 2s;
            proxy_pass http://user_svc/users/;
        }
        location /_internal/orders {
            internal;
            rewrite_by_lua_block { require("auth").forward("order-service") }
            proxy_read_timeout 2s;
            proxy_pass http://order_svc/orders;
        }

        location / { return 404 '{"error":"not found"}'; }
    }

    # =========================================================
    # Server benchmark: giống trên nhưng KHÔNG rate limit.
    # Không publish port, chỉ gọi được từ trong docker network.
    # =========================================================
    server {
        listen 8081;
        location /orders {
            access_by_lua_block { require("auth").verify("order-service") }
            proxy_pass http://order_svc;
        }
    }
}
