name: waf

services:
  web:
    image: bkimminich/juice-shop:v20.2.0
    ports:
      - "3000:3000"        
    healthcheck:           
      test: ["CMD", "/nodejs/bin/node", "-e",
             "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode==200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      retries: 20

  waf:
    image: owasp/modsecurity-crs:4.25.2-nginx-lts
    ports:
      - "8080:8080"       
    environment:
      BACKEND: http://web:3000      
      MODSEC_RULE_ENGINE: "On"      
      BLOCKING_PARANOIA: "1"       
    depends_on:
      web:
        condition: service_healthy  
    restart: on-failure
